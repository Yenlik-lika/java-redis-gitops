apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowlatesttag
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowLatestTag
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowlatesttag

        containers[c] { c := input.review.object.spec.template.spec.containers[_] }
        containers[c] { c := input.review.object.spec.template.spec.initContainers[_] }
        containers[c] { c := input.review.object.spec.containers[_] }

        violation[{"msg": msg}] {
          c := containers[_]
          endswith(c.image, ":latest")
          msg := sprintf("'latest' tag тыйым салынған: контейнер <%v>, образ <%v>", [c.name, c.image])
        }

        violation[{"msg": msg}] {
          c := containers[_]
          not contains(c.image, ":")
          msg := sprintf("Образда tag көрсетілмеген (latest болып саналады): контейнер <%v>, образ <%v>", [c.name, c.image])
        }
