apiVersion: v1
kind: Service
metadata:
  name: java-app
  labels:
    app: java-redis-app        # ServiceMonitor осы label бойынша табады
spec:
  selector:
    app: java-app
  ports:
    - name: http               # ServiceMonitor осы порт атауын қолданады
      port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
